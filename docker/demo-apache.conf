<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteRule ^$ /ilcan21/ [R=302,L]
        RewriteRule ^ilcan21/api/(config|src|database)(/|$) - [F,L]
        RewriteRule ^ilcan21/api/(public/)?(index|test_db)\.php$ - [F,L]
        RewriteRule ^ilcan21/api/?$ - [F,L]
        RewriteCond %{REQUEST_URI} ^/ilcan21/api/ [NC]
        RewriteRule ^ - [L]
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ilcan21/ /ilcan21/index.html [L]
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <Directory /var/www/html/ilcan21/api/storage>
        <FilesMatch "\.(php[0-9]?|phtml|phar|htaccess)$">
            Require all denied
        </FilesMatch>
    </Directory>
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>
